[package]
name = "rust_lib_flutter_rust_demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "im_client"
path = "src/bin/im_client.rs"

[dependencies]
flutter_rust_bridge = "=2.11.1"
openim-protocol = { path = "../../protocol" }
tokio = { version = "1.48", features = ["full","tracing"] }
console-subscriber = "0.5.0"
tokio-util = { version = "0.7" }
tokio-tungstenite = "0.24"
futures-util = "0.3"
chrono = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
flate2 = "1.0"
base64 = "0.22"
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
log = "0.4"
async-trait = "0.1"
tracing = "0.1.41"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "ansi"] }
tracing-appender = "0.2"
# 对齐 openim-sdk-core-rust 依赖的 sqlx 版本
sqlx = { version = "0.8.5", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "json",
    "migrate",
] }
http = "1.4.0"
tower = "0.5.2"
tower-http = {version = "0.6.8", features = ["full"]}
tower-reqwest = { version = "0.5.3" }
tower-http-client = "0.5.3"
bytes = "1.6"
http-body = "1.0"
http-body-util = "0.1"
clap = { version = "4.5", features = ["derive"] }
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.32.1"

[dev-dependencies]
test-context = "0.5.4"
tokio = { version = "1", features = ["full"] }
# 只输出 error，不输出 warning（与 .cargo/config.toml rustflags 二选一或同时保留均可）
[lints.rust]
warnings = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
