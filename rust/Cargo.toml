[package]
name = "rust_lib_flutter_rust_demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[workspace]

[dependencies]
im-core = { path = "../../im-core" }
flutter_rust_bridge = { version = "=2.12.0", optional = true }
openim-protocol = { path = "../../protocol" }
tokio = { version = "1.48", features = ["full","tracing"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1.41"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[profile.release]
opt-level = "z"       # 最小体积
lto = true            # 链接时优化，减少体积和编译产物
codegen-units = 1     # 单编译单元，优化更充分
strip = true          # 去除调试符号

[features]
default = ["ffi"]
ffi = ["flutter_rust_bridge"]

[dev-dependencies]
wiremock = "0.6"
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "ansi"] }
reqwest = { version = "0.13", features = ["json", "rustls", "multipart"], default-features = false }
tokio-tungstenite = "0.24"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
field_reassign_with_default = "allow"
doc_lazy_continuation = "allow"
tabs_in_doc_comments = "allow"
if_same_then_else = "allow"
needless_update = "allow"
assertions_on_constants = "allow"
unnecessary_sort_by = "allow"
should_implement_trait = "allow"
