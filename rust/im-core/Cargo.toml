[package]
name = "im-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "im_core"

[dependencies]
openim-protocol = { path = "../../../protocol" }
tokio = { version = "1.48", features = ["full", "tracing"] }
tokio-util = { version = "0.7" }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
chrono = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
prost = "0.13"
thiserror = "2.0"
rand = "0.8"
flate2 = "1.0"
base64 = "0.22"
reqwest = { version = "0.13", features = ["json", "rustls", "multipart"], default-features = false }
anyhow = "1.0"
log = "0.4"
async-trait = "0.1"
tracing = "0.1.41"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "ansi"] }
tracing-appender = "0.2"
tracing-log = "0.2"
md-5 = "0.10"
hex = "0.4"
url = "2"
http = "1.4.0"
bytes = "1.6"
http-body = "1.0"
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }

[dev-dependencies]
wiremock = "0.6"
uuid = { version = "1.10", features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
field_reassign_with_default = "allow"
doc_lazy_continuation = "allow"
tabs_in_doc_comments = "allow"
if_same_then_else = "allow"
needless_update = "allow"
assertions_on_constants = "allow"
unnecessary_sort_by = "allow"
should_implement_trait = "allow"
